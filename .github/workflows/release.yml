# 双平台发布构建：打 v* 标签时自动构建 Windows + macOS 并发 GitHub Release
# （本机无法交叉编译 macOS，mac 产物一律走这里的 CI）
name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            # universal 二进制：一个 dmg 同时支持 Apple Silicon 和 Intel
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build & create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FuckZhihuishuPro ${{ github.ref_name }}"
          releaseBody: |
            # FZHS Pro v1.0.3 更新说明

            本版本专门针对「刷一会儿就被限制、重开又很快被限制」的问题做了多处防护。

            ## ⏸️ 被限制后的冷却保护（最重要）
            - 账号被限制（-12）后有 30~60 分钟的账号级冷却期——冷却期内无论怎么重试都会再次失败，且每失败一次限制加重一分
            - 现在：被限制后 30 分钟内点"重新开始"会弹出明确警告，说明风险和正确的恢复步骤
            - 恢复引导文案重写：明确告知"冷却期内不要点重试"，并给出完整的四步恢复流程

            ## 🛡️ 请求更克制、更像真人
            - 修复会话自愈风暴：会话失效时此前每个上报周期都重新登录一次（半小时视频最多 60 次登录请求，本身就是异常行为）。现在整个课程最多自愈 3 次，超过后提示重新扫码登录
            - 课程之间随机冷却 3~8 秒，更像真人切换

            ## 📋 v1.0.2 已包含的修复
            - 修复 code:-8"学习总时长下降了"：进度绝不倒退，服务器进度领先时自动同步对齐
            - 修复终点进度丢失、会话恢复空窗、观看点累积异常
            - 错误分级：可自愈的小问题显示黄色警告，不再红色报错
            - 账号被限制时立即停止全部请求（不再加重风控）
            - 修复"清空全部"后旧卡片复活、二维码过期假死、调度竞态等

            ## 💡 被限制后的正确恢复步骤（重要）
            1. 等 30~60 分钟，期间不要点重新开始
            2. 用浏览器登录智慧树网页版，手动播放任意视频 1~2 分钟（证明是真人）
            3. 回到本程序，退出登录 → 重新扫码登录（获取干净会话）
            4. 只挂一门课，等它完整跑完再挂下一门

            ## 📦 下载
            - Windows：portable.zip（免安装，推荐发同学）或 -setup.exe（安装包）
            - macOS：universal.dmg（未签名，首次打开请右键 → 打开）

            仅供学习交流，请合理安排时间。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 便携 zip（exe + README.txt 平铺，全 ASCII 文件名）由 CI 统一打包附加到 Release
      - name: Pack portable zip (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item src-tauri/target/release/fuckzhihuishupro.exe FuckZhihuishuPro.exe
          Copy-Item 使用说明.txt README.txt
          Compress-Archive -Path FuckZhihuishuPro.exe, README.txt -DestinationPath FuckZhihuishuPro-portable.zip -Force
          gh release upload ${{ github.ref_name }} FuckZhihuishuPro-portable.zip --clobber
