# 双平台发布构建：打 v* 标签时自动构建 Windows + macOS 并发 GitHub Release
# （本机无法交叉编译 macOS，mac 产物一律走这里的 CI）
name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "macos-latest"
            # universal 二进制：一个 dmg 同时支持 Apple Silicon 和 Intel
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build & create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FuckZhihuishuPro ${{ github.ref_name }}"
          releaseBody: |
            # FZHS Pro 更新说明

            ## 🛡️ 刷课更稳、更不容易被限制
            - 修复终点进度丢失：最后一秒进度上报失败会强制补报，失败则不标记完成，避免下轮重刷同一段触发风控
            - 修复会话恢复空窗：学习会话失效后原地重报本次进度，不再留 30 秒"客户端在走、服务器没记录"的空窗
            - 修复观看点跨周期累积异常，数据与原版协议一致
            - 修复进度上报的课程 ID 来源，避免报错 ID
            - 伪装观看更真实：暂停不丢弃后台请求；停止/切课后立即中断旧请求
            - 校内课：终点重试响应停止、时长取整、零时长资源正确跳过

            ## 🚀 队列调度不再卡死
            - 修复竞态：新任务加入瞬间旧调度刚好结束时任务永久滞留的问题
            - 账号限制后复位暂停状态，避免处理完验证码重开刷时卡住

            ## 🖥️ 界面与操作
            - 修复"清空全部"后旧卡片复活、永远卡在"准备中"的问题
            - 二维码过期自动换新，不再无限转圈
            - 设置即时保存更可靠：退出前保存最后修改，非法输入不再静默失败
            - 拖拽排序滚动时落点不再错位；修复若干监听器泄漏

            ## 📦 下载
            - Windows：portable.zip（免安装，推荐发同学）或 -setup.exe（安装包）
            - macOS：universal.dmg（未签名，首次打开请右键 → 打开）

            仅供学习交流，请合理安排时间。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # 便携 zip（exe + README.txt 平铺，全 ASCII 文件名）由 CI 统一打包附加到 Release
      - name: Pack portable zip (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item src-tauri/target/release/fuckzhihuishupro.exe FuckZhihuishuPro.exe
          Copy-Item 使用说明.txt README.txt
          Compress-Archive -Path FuckZhihuishuPro.exe, README.txt -DestinationPath FuckZhihuishuPro-portable.zip -Force
          gh release upload ${{ github.ref_name }} FuckZhihuishuPro-portable.zip --clobber
